name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: tgs-talk-to-data
  REGION: europe-west4
  REPO_NAME: talk-to-my-data-repo
  BACKEND_SERVICE: talk-to-my-data-backend
  FRONTEND_SERVICE: talk-to-my-data-frontend
  RUNTIME_SERVICE_ACCOUNT: talk-to-my-data-backend@tgs-talk-to-data.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          project_id: '${{ env.PROJECT_ID }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ env.PROJECT_ID }}'

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe ${{ env.REPO_NAME }} --location=${{ env.REGION }} >/dev/null 2>&1 || \
          gcloud artifacts repositories create ${{ env.REPO_NAME }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Docker repository for Talk-to-my-Data application"

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Backend Image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          docker build -t $IMAGE_TAG -f Dockerfile.backend .
          docker push $IMAGE_TAG

      - name: Build and Push Frontend Image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
          docker build -t $IMAGE_TAG -f Dockerfile.frontend .
          docker push $IMAGE_TAG

      - name: Deploy Backend to Cloud Run
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --platform managed \
            --port 8080 \
            --min-instances 1 \
            --max-instances 2 \
            --service-account ${{ env.RUNTIME_SERVICE_ACCOUNT }} \
            --set-env-vars="VERTEX_AI_PROJECT_ID=${{ env.PROJECT_ID }},BIGQUERY_PROJECT_ID=${{ env.PROJECT_ID }},GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }}" \
            --allow-unauthenticated

      - name: Deploy Frontend to Cloud Run
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
          
          # Get backend URL
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} --format 'value(status.url)')
          
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --platform managed \
            --port 8501 \
            --session-affinity \
            --min-instances 1 \
            --max-instances 2 \
            --service-account ${{ env.RUNTIME_SERVICE_ACCOUNT }} \
            --set-env-vars="BACKEND_API_URL=$BACKEND_URL/ask" \
            --allow-unauthenticated
